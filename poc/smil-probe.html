<!DOCTYPE html>
<meta charset="utf-8">
<title>smil-probe: is SMIL alive in this build?</title>
<!--
  Minimal check for the fedisplacement-selector page: does a plain SMIL
  animation advance at all in the tree under test?  Two independent targets --
  a rect's x attribute and an feDisplacementMap's xChannelSelector -- are
  sampled every frame and reported through document.title.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <defs>
    <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feDisplacementMap id="d" in="SourceGraphic" in2="SourceGraphic"
                         xChannelSelector="R" yChannelSelector="G" scale="8"/>
    </filter>
  </defs>
  <rect id="r" x="0" y="0" width="64" height="64" fill="#2f6f2f" filter="url(#f)"/>
  <animate href="#r" attributeName="x" from="0" to="20" begin="0.2s" dur="0.4s" fill="freeze"/>
  <animate href="#d" attributeName="xChannelSelector" from="R" to="foo" begin="0.2s" dur="0.4s" fill="freeze"/>
</svg>
<script>
const qs = new URLSearchParams(location.search);
const WAIT = Number(qs.get("wait") || 3000);
let t0 = performance.now();
let done = false;

function log(m) {
  document.title = m;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.log) {
    try { window.webkit.messageHandlers.log.postMessage(m); } catch (e) {}
  }
}

function tick() {
  if (done)
    return;
  const t = (performance.now() - t0) / 1000;
  const x = r.x.animVal.value;
  const sel = d.xChannelSelector.animVal;
  if (t > 0.9 || sel === 0) {
    done = true;
    log("t=" + t.toFixed(2) + " rect.x.animVal=" + x + " xChannelSelector.animVal=" + sel
        + (x > 0 ? " SMIL-ALIVE" : " SMIL-DEAD"));
    return;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setTimeout(function () { if (!done) { done = true; log("SMIL-DEAD at " + WAIT + "ms"); } }, WAIT);
</script>
